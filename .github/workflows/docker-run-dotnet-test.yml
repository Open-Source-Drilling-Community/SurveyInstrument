name: Docker run & .NET UnitTest

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Service docker image
      run: docker build --file Service/Dockerfile --tag apiunittesting/service:latest .

    - name: Run Service container
      # mapping http port to 8080 (which is reached by the unit test in ServiceTest, see source code)
      run: docker run -dt -p 8080:8080 apiunittesting/service:latest

    - name: Wait for Service readiness
      shell: bash
      run: |
        for attempt in {1..30}; do
          if curl --fail --silent http://localhost:8080/SurveyInstrument/api/SurveyInstrument > /dev/null; then
            exit 0
          fi
          sleep 1
        done
        docker ps -a
        docker logs $(docker ps -aq --filter ancestor=apiunittesting/service:latest | head -1)
        exit 1

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      # forcing Release configuration to avoid issue with writing Service OpenApiSchema on build from Service to ModelSharedForClient
      run: dotnet build --no-restore --configuration 'Release'

    - name: Run ServiceTest & ModelTest
      # forcing Release configuration to avoid issue with the writing of auto-generated code on-build from Service to ModelSharedForClient
      run: dotnet test --no-build --verbosity normal --configuration 'Release'
